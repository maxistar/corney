name: Build ZMK firmware

on:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'CMakeLists.txt'
      - 'Kconfig'
      - 'build.yaml'
      - 'config/**'
      - 'dts/**'
      - 'include/**'
      - 'layout_corney.json'
      - 'src/**'
      - 'tests/**'
      - 'zephyr/**'
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - 'CMakeLists.txt'
      - 'Kconfig'
      - 'build.yaml'
      - 'config/**'
      - 'dts/**'
      - 'include/**'
      - 'layout_corney.json'
      - 'src/**'
      - 'tests/**'
      - 'zephyr/**'
  workflow_dispatch:
    inputs:
      keyboard_name:
        description: 'Optional Bluetooth device name override'
        required: false
        type: string
        default: ''

jobs:
  host-tests:
    runs-on: ubuntu-22.04
    name: Host tests and formatting
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang-format

      - name: Check formatting
        run: clang-format --dry-run --Werror include/corney/*.h src/*.c tests/ble_contract_test.c

      - name: Run host tests
        run: tests/run-host-tests.sh

  zmk-integration-tests:
    runs-on: ubuntu-latest
    name: ZMK native integration tests
    container:
      image: zmkfirmware/zmk-build-arm:stable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create isolated west workspace
        run: |
          base_dir="$(mktemp -d)"
          echo "base_dir=${base_dir}" >> "$GITHUB_ENV"
          mkdir -p "${base_dir}/config"
          cp -R config/. "${base_dir}/config/"

      - name: West Init
        working-directory: ${{ env.base_dir }}
        run: west init -l config

      - name: West Update
        working-directory: ${{ env.base_dir }}
        run: west update

      - name: West Zephyr export
        working-directory: ${{ env.base_dir }}
        run: west zephyr-export

      - name: Run ZMK integration tests
        run: ZMK_SRC_DIR="$base_dir/zmk/app" ZMK_BUILD_DIR="$GITHUB_WORKSPACE/.build/native-tests" tests/run-zmk-integration-tests.sh

  matrix:
    runs-on: ubuntu-22.04
    name: Fetch Build Keyboards
    outputs:
      build_matrix: ${{ env.build_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yaml2json
        run: python3 -m pip install remarshal

      - name: Fetch Build Matrix
        run: |
          echo "build_matrix=$(yaml2json 'build.yaml' | jq -c .)" >> "$GITHUB_ENV"
          yaml2json "build.yaml" | jq

  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    needs:
      - host-tests
      - zmk-integration-tests
      - matrix
    name: Build
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.build_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create build directory
        run: |
          echo "build_dir=$(mktemp -d)" >> "$GITHUB_ENV"

      - name: Prepare variables
        shell: sh -x {0}
        env:
          board: ${{ matrix.board }}
          shield: ${{ matrix.shield }}
          artifact_name: ${{ matrix.artifact-name }}
          snippet: ${{ matrix.snippet }}
          keyboard_name: ${{ github.event.inputs.keyboard_name || '' }}
        run: |
          if [ -e zephyr/module.yml ]; then
            export zmk_load_arg=" -DZMK_EXTRA_MODULES='${GITHUB_WORKSPACE}'"
            new_tmp_dir="${TMPDIR:-/tmp}/zmk-config"
            mkdir -p "${new_tmp_dir}"
            echo "base_dir=${new_tmp_dir}" >> "$GITHUB_ENV"
          else
            echo "base_dir=${GITHUB_WORKSPACE}" >> "$GITHUB_ENV"
          fi

          if [ -n "${snippet}" ]; then
            extra_west_args="-S \"${snippet}\""
          fi

          if [ -n "${keyboard_name}" ] && [ "${shield}" = "corney_left" ]; then
            extra_name_arg=" -DCONFIG_ZMK_KEYBOARD_NAME=\"${keyboard_name}\""
          fi

          echo "zephyr_version=${ZEPHYR_VERSION}" >> "$GITHUB_ENV"
          echo "extra_west_args=${extra_west_args}" >> "$GITHUB_ENV"
          echo "extra_cmake_args=${shield:+-DSHIELD=\"$shield\"}${zmk_load_arg}${extra_name_arg}" >> "$GITHUB_ENV"
          echo "display_name=${shield:+$shield - }${board}" >> "$GITHUB_ENV"
          echo "artifact_name=${artifact_name:-${shield:+$shield-}${board}-zmk}" >> "$GITHUB_ENV"

      - name: Copy config files to isolated temporary directory
        run: |
          if [ "${{ env.base_dir }}" != "${GITHUB_WORKSPACE}" ]; then
            mkdir "${{ env.base_dir }}/config"
            cp -R config/* "${{ env.base_dir }}/config/"
          fi

      - name: Cache west modules
        uses: actions/cache@v4
        continue-on-error: true
        env:
          cache_name: cache-zephyr-${{ env.zephyr_version }}-modules
        with:
          path: |
            ${{ env.base_dir }}/modules/
            ${{ env.base_dir }}/tools/
            ${{ env.base_dir }}/zephyr/
            ${{ env.base_dir }}/bootloader/
            ${{ env.base_dir }}/zmk/
          key: ${{ runner.os }}-build-${{ env.cache_name }}-${{ hashFiles('**/west.yml', '**/build.yaml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache_name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: West Init
        working-directory: ${{ env.base_dir }}
        run: west init -l "${{ env.base_dir }}/config"

      - name: West Update
        working-directory: ${{ env.base_dir }}
        run: west update

      - name: West Zephyr export
        working-directory: ${{ env.base_dir }}
        run: west zephyr-export

      - name: West Build (${{ env.display_name }})
        working-directory: ${{ env.base_dir }}
        shell: sh -x {0}
        run: west build -s zmk/app -d "${{ env.build_dir }}" -b "${{ matrix.board }}" ${{ env.extra_west_args }} -- -DZMK_CONFIG=${{ env.base_dir }}/config ${{ env.extra_cmake_args }} ${{ matrix.cmake-args }}

      - name: ${{ env.display_name }} Kconfig file
        run: |
          if [ -f "${{ env.build_dir }}/zephyr/.config" ]; then
            grep -v -e "^#" -e "^$" "${{ env.build_dir }}/zephyr/.config" | sort
          else
            echo "No Kconfig output"
          fi
        if: ${{ !cancelled() }}

      - name: ${{ env.display_name }} Devicetree file
        run: |
          if [ -f "${{ env.build_dir }}/zephyr/zephyr.dts" ]; then
            cat "${{ env.build_dir }}/zephyr/zephyr.dts"
          elif [ -f "${{ env.build_dir }}/zephyr/zephyr.dts.pre" ]; then
            cat -s "${{ env.build_dir }}/zephyr/zephyr.dts.pre"
          else
            echo "No Devicetree output"
          fi
        if: ${{ !cancelled() }}

      - name: Rename artifacts
        shell: sh -x {0}
        run: |
          mkdir "${{ env.build_dir }}/artifacts"
          if [ -f "${{ env.build_dir }}/zephyr/zmk.uf2" ]; then
            cp "${{ env.build_dir }}/zephyr/zmk.uf2" "${{ env.build_dir }}/artifacts/${{ env.artifact_name }}.uf2"
          elif [ -f "${{ env.build_dir }}/zephyr/zmk.bin" ]; then
            cp "${{ env.build_dir }}/zephyr/zmk.bin" "${{ env.build_dir }}/artifacts/${{ env.artifact_name }}.bin"
          fi

      - name: Archive (${{ env.display_name }})
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ env.artifact_name }}
          path: ${{ env.build_dir }}/artifacts

  merge:
    runs-on: ubuntu-latest
    needs: build
    name: Merge Output Artifacts
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: firmware
          pattern: artifact-*
          delete-merged: true
