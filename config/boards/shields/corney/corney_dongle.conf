# The keyless dongle receives keys and pointing from two BLE peripherals.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=n
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7

# The USB-powered dongle drives a four-wire 128x64 SSD1306 over the Pro Micro
# I2C pins. Its custom compositor retains ZMK's stock status widgets and adds
# one compact row for the two split-peripheral battery levels and a full-width
# active-layer name in the bottom row.
CONFIG_I2C=y
CONFIG_SSD1306=y
CONFIG_DISPLAY=y
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_CORNEY_DONGLE_BATTERY_STATUS_SCREEN=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=n

# Monochrome SSD1306 panels require a one-bit LVGL framebuffer.
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_THEME_MONO=y
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_16=y
CONFIG_ZMK_LV_FONT_DEFAULT_SMALL_MONTSERRAT_12=y
CONFIG_LV_Z_MEM_POOL_SIZE=4096
CONFIG_LV_Z_VDB_SIZE=64
CONFIG_LV_DPI_DEF=148
CONFIG_LV_Z_BITS_PER_PIXEL=1
CONFIG_LV_COLOR_DEPTH_1=y
