#include <dt-bindings/zmk/pointing.h>

# Enable mouse movement
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_MOUSE_TICK_DURATION=8

# Optional: Adjust mouse movement speed (default is 500)
CONFIG_ZMK_MOUSE_DEFAULT_SPEED=500

ZMK_KEYBOARD_NAME="Corney"

# Five host profiles plus the right split peripheral. The Keyboard Helper
# extension requires at least two host connections to remain available for
# concurrent event subscribers.
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6
